site_name: GeoReSeT Corpus
repo_url: https://github.com/NoeFlandre/GeoReSeT-Corpus
theme:
  name: material
  features: [content.code.copy]
nav:
  - Overview: index.md
  - Pipeline: pipeline.md
  - Development: development.md
  - Reference: reference.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
markdown_extensions:
  - admonition
  - pymdownx.superfences
