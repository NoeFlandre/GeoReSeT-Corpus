[project]
name = "georeset"
version = "1.0.0"
description = "Build and publish the GeoReSeT corpus: land-use labelled sentences tied to OpenStreetMap polygons."
readme = "README.md"
authors = [
    { name = "Noé Flandre", email = "noe.flandre@inria.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "h3>=4.5.0",
    "huggingface-hub>=1.5.0",
    "langcodes>=3.5.1",
    "language-data>=1.4.0",
    "matplotlib>=3.11.2",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "shapely>=2.2.0",
    "typer>=0.27.3",
    "llms-xx-to-en-translation",
]

[project.optional-dependencies]
# Grid'5000 job environments only: NLLB on CTranslate2 and GlotLID.
translate = [
    "ctranslate2>=4.6",
    "transformers>=5.20",
    "sentencepiece>=0.2",
    "fasttext-turbo==0.1.1",
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'",
]
# Grid'5000 job environments only: the sentence embedder (as in scripts/embed.py).
embed = ["sentence-transformers>=5.1", "torch>=2.8"]
# Grid'5000 GPU jobs only: the benchmark's runtime, SGLang with the DSpark draft (pins as in the benchmark).
label = [
    "sglang==0.5.20",
    "cuda-tile>=1.6.0rc5",
    "flash-attn-4>=4.0.0b18",
]
# Grid'5000 CPU jobs only: the chat template, to tokenize the prompts before the GPU job.
tokenize = ["transformers>=5.12.1", "jinja2>=3.1"]

[tool.uv]
# SGLang pins its own torch and transformers, so these environments cannot share a lock.
conflicts = [
    [{ extra = "label" }, { extra = "translate" }],
    [{ extra = "label" }, { extra = "embed" }],
]

[tool.uv.sources]
# The benchmark that chose the model: its generation budget and failure checks are reused as they are.
llms-xx-to-en-translation = { git = "https://github.com/NoeFlandre/llms-xx-to-en-translation", rev = "d0458863b6d3ab8eb3950d4d7b6b917f68dba30b" }

[project.scripts]
georeset = "georeset.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.8",
    "mutmut>=3.8.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
norecursedirs = [".*", "data", "__pycache__"]

[tool.mutmut]
source_paths = ["src/georeset/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["tools/"]
# Matplotlib styling only; checked visually (see the module docstring).
do_not_mutate = ["src/georeset/publish/figures.py"]
# polars' thread pool does not survive fork(): fork workers from a clean server instead.
process_isolation = "forkserver"
forkserver_warmup = "none"

[tool.coverage.run]
branch = true
source = ["georeset", "tools"]
# Need a GPU (SGLang) or the real tokenizer: exercised on Grid'5000, not in the unit tests.
omit = ["src/georeset/label/engine.py", "src/georeset/label/tokenizer.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
