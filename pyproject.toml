[project]
name = "georeset"
version = "0.1.0"
description = "Build and publish the GeoReSeT corpus: land-use labelled sentences tied to OpenStreetMap polygons."
readme = "README.md"
authors = [
    { name = "Noé Flandre", email = "noe.flandre@inria.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "h3>=4.5.0",
    "huggingface-hub>=2.3.0",
    "langcodes>=3.5.1",
    "matplotlib>=3.11.2",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
    "typer>=0.27.3",
]

[project.scripts]
georeset = "georeset.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.8",
    "mutmut>=3.8.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]
