[project]
name = "georeset"
version = "0.1.0"
description = "Build and publish the GeoReSeT corpus: land-use labelled sentences tied to OpenStreetMap polygons."
readme = "README.md"
authors = [
    { name = "Noé Flandre", email = "noe.flandre@inria.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "h3>=4.5.0",
    "huggingface-hub>=2.3.0",
    "langcodes>=3.5.1",
    "language-data>=1.4.0",
    "matplotlib>=3.11.2",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pyproj>=3.8.0",
    "pyshp>=3.1.6",
    "shapely>=2.2.0",
    "typer>=0.27.3",
]

[project.scripts]
georeset = "georeset.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.8",
    "mutmut>=3.8.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
norecursedirs = [".*", "data", "__pycache__"]

[tool.mutmut]
source_paths = ["src/georeset/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["tools/"]
# Matplotlib styling only; checked visually (see the module docstring).
do_not_mutate = ["src/georeset/publish/figures.py"]
# polars' thread pool does not survive fork(): fork workers from a clean server instead.
process_isolation = "forkserver"
forkserver_warmup = "none"

[tool.coverage.run]
branch = true
source = ["georeset", "tools"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
